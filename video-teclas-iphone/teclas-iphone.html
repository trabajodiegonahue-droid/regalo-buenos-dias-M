function kbSim(init,taps,lt){
  const st={ch:Array.from(init.text),cur:null,layout:init.layout||'abc',shift:init.shift||0,lastShift:-9,lastSpace:-9,lastInput:-9};
  const evs=taps.map(t=>({...t,eff:t.at+(t.hold||0)+.08})).sort((a,b)=>a.eff-b.eff);
  for(const e of evs){ if(e.eff>lt) break; applyTap(st,e); if(e.k!=='nop') st.lastInput=e.eff; }
  return st;
}
function applyTap(st,e){
  const c=st.cur==null?st.ch.length:st.cur;
  const ins=s=>{const a=Array.from(s); st.ch.splice(c,0,...a); if(st.cur!=null) st.cur=c+a.length;};
  switch(e.k){
    case 'shift': if(e.at-st.lastShift<.4&&st.shift===1) st.shift=2; else st.shift=st.shift?0:1; st.lastShift=e.at; return;
    case 'space':{
      if(e.at-st.lastSpace<.45&&st.ch[c-1]===' '&&/[\p{L}\p{N}]/u.test(st.ch[c-2]||'')){ st.ch.splice(c-1,1,'.',' '); if(st.cur!=null) st.cur=c+1; st.shift=1; }
      else ins(' ');
      st.lastSpace=e.at; return; }
    case 'del': if(c>0){st.ch.splice(c-1,1); if(st.cur!=null) st.cur=c-1;} if(!st.ch.length) st.shift=1; return;
    case 'delword':{ let i=c; while(i>0&&st.ch[i-1]===' ') i--; while(i>0&&st.ch[i-1]!==' ') i--; st.ch.splice(i,c-i); if(st.cur!=null) st.cur=i; if(!st.ch.length) st.shift=1; return; }
    case '123': st.layout='num'; return;
    case 'abc': st.layout='abc'; return;
    case 'emoji': st.layout='emoji'; return;
    case 'cur': st.cur=e.set; return;
    case 'nop': return;
  }
  if(e.ins){ ins(e.ins); if(st.shift===1) st.shift=0; return; }
  if(/^e\d+$/.test(e.k)){ ins(EMOJIS[+e.k.slice(1)]); return; }
  let ch=e.k; if(st.layout==='abc'&&st.shift) ch=ch.toUpperCase(); ins(ch); if(st.shift===1) st.shift=0;
}

  let best=null,bd=9;

}

let acc=0; for(const s of STEPS){ s.start=acc; acc+=s.dur; }
const TOTAL=acc;
const CHSPAN={}; for(const s of STEPS){ const c=CHSPAN[s.ch]||(CHSPAN[s.ch]={a:s.start,b:0}); c.b=s.start+s.dur; }
window.TL=(()=>{const ev=[];
  STEPS.forEach((s,i)=>{
    if(i>0&&STEPS[i-1].ch!==s.ch&&s.ch!=='outro') ev.push([s.start,'whoosh']);
    (s.presses||[]).forEach(([b,a,len,mode])=>{ ev.push([s.start+a,mode==='light'?'haptic':'click']); if(len>.5&&mode!=='light') ev.push([s.start+a+len,'release']); });
    (s.taps||[]).forEach(t=>{ if(t.sfx===false||t.k==='nop') return; ev.push([s.start+t.at+(t.hold||0)*(t.ins?1:0),'tap']); });
    if(s.holdKey) ev.push([s.start+s.holdKey[1]-.001,'tap']);
    (s.sfx||[]).forEach(([a,type])=>ev.push([s.start+a,type]));
  });
  ev.sort((a,b)=>a[0]-b[0]);
  return {dur:TOTAL,fps:30,events:ev.map(([t,type])=>({t:+t.toFixed(3),type}))};
})();

function pressInfo(step,lt,btn){
  let depth=0,glow=0,op=0,off=60,ring=-1;
  for(const [b,a,len,mode] of step.presses||[]){
    if(b!==btn) continue;
    const k=mode==='light'?.4:1;
    depth=Math.max(depth,k*Math.min(prog(lt,a-.08,a),1-prog(lt,a+len,a+len+.1)));
    glow=Math.max(glow,win(lt,a-.3,a+len+.45,.15));
    const o=win(lt,a-.45,a+len+.4,.18);
    if(o>0){ op=Math.max(op,o); const ap=eout(prog(lt,a-.45,a-.08)), rt=prog(lt,a+len+.08,a+len+.4); off=Math.min(off,46*(1-ap)+46*rt); }
    if(lt>=a&&lt<=a+.55&&mode!=='light') ring=Math.max(ring,prog(lt,a,a+.55));
  }
  return {depth,glow,op,off,ring};
}

  if(S.touch.op>0){ tc.style.left=S.touch.x+'px'; tc.style.top=S.touch.y+'px'; tc.style.transform=`scale(${1+.25*Math.sin(Math.PI*S.touch.ring)})`; }

  // ---- teclado ----
  if(S.kb) applyKb(S.kb,t);

  // ---- botones físicos ----
  for(const [k,b] of Object.entries(BTN)){
    const pi=pressInfo(step,lt,k), g=Math.max(pi.glow,S.hl[k]||0), sgn=b.s==='L'?1:-1;
    const el=$('hw-'+k); el.style.transform=`translateX(${sgn*pi.depth*5}px)`;
    el.style.boxShadow=g>.01?`0 0 ${22*g}px ${7*g}px ${hexA(A,.85*g)}`:'none';
    el.firstChild.style.background=A; el.firstChild.style.opacity=g*.85;
    const f=$('f-'+k), cy=b.top+b.h/2+(k==='cam'?S.slide:0);
    vis(f,pi.op);
    if(pi.op>0){ const x=b.s==='L'?-8-80-pi.off+pi.depth*5:478+pi.off-pi.depth*5; f.style.left=x+'px'; f.style.top=(cy-40)+'px'; }
    const rg=$('r-'+k);
    if(pi.ring>=0){ const p=pi.ring; vis(rg,(1-p)*.9); rg.style.borderColor=A; rg.style.left=(b.s==='L'?-2-48:472-48)+'px'; rg.style.top=(cy-48)+'px'; rg.style.transform=`scale(${lerp(.5,1.9,eout(p))})`; }
    else vis(rg,0);
  }

  // ---- etiquetas del mapa ----
  LABELS.forEach((l,j)=>{const p=S.labels[j]*S.labelsOp, d=$('ml'+j);
    d.style.opacity=p; d.style.transform=`translateX(${(1-eout(S.labels[j]))*(l.side==='L'?-24:24)}px)`;
    const ln=$('mline'+j); ln.setAttribute('opacity',p); ln.setAttribute('stroke-dashoffset',48*(1-S.labels[j]));
    const dt=$('mdot'+j); dt.setAttribute('opacity',p); dt.setAttribute('r',8*eback(S.labels[j]));});

  // ---- consejo / resumen ----
  let tip='';
  if(step.tipFn) tip=step.tipFn(lt);
  else if(step.tip) tip=`<div class="tipc"><div class="ti" style="color:${A}">${ICON.bulb}</div><div>${esc(step.tip)}</div></div>`;
  else if(S.recap>=0){ const items=[['Lateral','side'],['Volumen','vol'],['Acción','action'],['Cámara','cam'],['Combinaciones','combo'],['Teclado','kbd']];
    tip='<div class="chips">'+items.map(([n,c],j)=>{const p=eout(prog(S.recap,1.2+j*.18,1.6+j*.18));
      return `<div class="chip2" style="border-color:${CH[c].acc};color:${CH[c].acc};opacity:${p.toFixed(3)};transform:translateY(${((1-p)*20).toFixed(1)}px)">${ICON.check}<span style="color:#fff">${n}</span></div>`;}).join('')+'</div>'; }
  const tipEl=$('tip'); setOnce(tipEl,'tip','innerHTML',tip);
  const tipOp=tip?(S.recap>=0?1-tOut:Math.min(prog(lt,.45,.8),1-tOut)):0;
  tipEl.style.opacity=tipOp; tipEl.style.transform=`translateY(${(1-eout(prog(lt,.45,.85)))*20}px)`;

  // ---- progreso ----
  document.querySelectorAll('#prog i').forEach((el,j)=>{const c=CHSPAN[PROG_CH[j]]; el.style.width=(prog(t,c.a,c.b)*100)+'%';});
  $('prog').style.opacity=step.ch==='intro'?prog(lt,3.4,4.2):1;
  $('fadeov').style.opacity=S.fadeAll;
}

const KBC={};
function applyKb(kb,t){
  // diseño visible
  for(const [s,id] of [['abc','kabc'],['num','knum'],['emoji','kemoji']]) $(id).style.display=kb.layout===s?'block':'none';
  // mayúsculas en las letras
  const up=kb.shift>0;
  if(KBC.up!==up){ KBC.up=up; for(const k of LAYOUT.abc) if(k.t==='l') KEYEL.abc[k.id].textContent=up?k.label.toUpperCase():k.label; }
  const sh=['off','on','caps'][kb.shift];
  if(KBC.sh!==sh){ KBC.sh=sh; $('shiftic').innerHTML=SHIFT[sh]; }
  // teclas presionadas
  if(KBC.pressedEl){ const k=KBC.pressedEl; k.el.style.background=k.bg; KBC.pressedEl=null; }
  KEYEL.abc.shift.style.background=kb.shift?'#fff':'';
  if(kb.pressed&&KEYEL[kb.layout][kb.pressed]){ const el=KEYEL[kb.layout][kb.pressed], r=keyRect(kb.layout,kb.pressed);
    KBC.pressedEl={el,bg:el.style.background};
    el.style.background=r.t==='s'?'#fff':r.t==='e'||r.t==='x'?'rgba(0,0,0,.12)':'#c5c9d1'; }
  // globo de la letra
  const pop=$('kpop');
  if(kb.pop){ const r=keyRect(kb.layout,kb.pop), pw=r.w+24, x=clamp(r.x-12,2,438-pw-2);
    pop.style.display='block'; pop.style.left=x+'px'; pop.style.top=(r.y-60)+'px'; pop.style.width=pw+'px'; pop.style.height=(r.h+60)+'px';
    pop.textContent=(kb.layout==='abc'&&kb.shift)?r.label.toUpperCase():r.label; }
  else pop.style.display='none';
  // menú de acentos
  const ac=$('kacc');
  if(kb.acc){ const r=keyRect('abc','e'); ac.style.display='block'; ac.style.left=(r.x-6)+'px'; ac.style.top=(r.y-62)+'px'; ac.style.opacity=kb.acc.op;
    const html=['e','é','è','ê','ë','ē'].map((c,j)=>`<span class="${j===kb.acc.sel?'sel':''}">${c}</span>`).join('');
    if(KBC.acc!==html){KBC.acc=html; ac.innerHTML=html;} }
  else ac.style.display='none';
  $('kblank').style.opacity=kb.tp;
  // texto con cursor
  const ch=Array.from(kb.text), ci=kb.cur==null?ch.length:kb.cur;
  const on=kb.since<.55||kb.tp>0||Math.floor(t*1.8)%2===0;
  const html=esc(ch.slice(0,ci).join(''))+`<span class="cur" style="opacity:${on?1:0}"></span>`+esc(ch.slice(ci).join(''));
  if(KBC.html!==html){KBC.html=html; $('ntext').innerHTML=html;}
  $('ntext').style.opacity=kb.textOp;
}

window.renderAt=renderAt;
window.TOTAL=TOTAL;
renderAt(0);
// Vista previa en vivo si se abre directamente en el navegador (no durante la captura)
if(!navigator.webdriver){ const t0=performance.now(); const loop=()=>{ renderAt(((performance.now()-t0)/1000)%TOTAL); requestAnimationFrame(loop); }; requestAnimationFrame(loop); }
</script>
