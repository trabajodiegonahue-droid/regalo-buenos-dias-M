<title>Teclado predictivo</title>
<!--
  Animación del video "Tu iPhone sabe qué letra vas a tocar… antes que tú".
  Fondo negro, el teléfono al centro. Una "cámara" se mete dentro del iPhone
  (vista en capas: vidrio, telaraña táctil, pantalla y cerebrito) y luego explica
  los "jardines" invisibles de cada tecla.
  Los tiempos salen de voice-timeline.js (voice.py). renderAt(t) dibuja el cuadro t.
-->
<script src="voice-timeline.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:#000}
body{font-family:Inter,"Noto Color Emoji",system-ui,sans-serif;color:#fff;-webkit-font-smoothing:antialiased}
#stage{position:absolute;inset:0;overflow:hidden;background:#000}
#spot{position:absolute;left:-160px;top:160px;width:1400px;height:1400px;border-radius:50%;

.cur{display:inline-block;width:3px;height:34px;margin:0 -1px 0 1px;vertical-align:-7px;border-radius:1.5px;background:#e5a50a}
.panel{position:absolute;left:20px;width:398px;opacity:0}
#pthink{top:426px;display:flex;align-items:center;gap:12px}

#emoji{position:absolute;left:169px;top:430px;width:100px;height:100px;font-size:84px;line-height:100px;text-align:center;opacity:0}
#cta{position:absolute;left:69px;top:450px;width:300px;height:76px;border-radius:38px;background:linear-gradient(135deg,#0a84ff,#40c8e0);
  color:#fff;font-size:27px;font-weight:800;display:flex;align-items:center;justify-content:center;gap:10px;opacity:0;box-shadow:0 10px 26px rgba(10,132,255,.4)}

#kbbg{position:absolute;inset:0;background:#d2d5db}
.key{position:absolute;height:50px;border-radius:8px;background:#fff;box-shadow:0 1.3px 0 rgba(0,0,0,.32);

.key .ki{width:25px;height:25px;color:#111}
.kbi{position:absolute;top:254px;width:27px;height:27px;color:#4d525a}
.kbhome{position:absolute;top:288px;left:152px;width:134px;height:5px;border-radius:3px;background:#000}
#zones{position:absolute;inset:0;pointer-events:none}
.zone{position:absolute;border-radius:9px;opacity:0}
#bline{position:absolute;left:44.7px;top:60px;width:3px;height:74px;opacity:0;background:repeating-linear-gradient(180deg,#ff3b30 0 6px,transparent 6px 11px)}
#kpop{position:absolute;display:none;background:#fff;border-radius:11px;box-shadow:0 2px 8px rgba(0,0,0,.32);text-align:center;font-size:38px;line-height:52px;color:#000}
#touch{position:absolute;width:44px;height:44px;margin:-22px 0 0 -22px;border-radius:50%;opacity:0;z-index:5;
  background:rgba(50,54,72,.5);border:3px solid rgba(255,255,255,.95);box-shadow:0 2px 10px rgba(0,0,0,.35)}
#tring{position:absolute;width:44px;height:44px;margin:-22px 0 0 -22px;border-radius:50%;border:3px solid #ff3b30;opacity:0;z-index:5}

/* elementos 3D que miran a la cámara */
.bb{position:absolute;left:0;top:0;transform-origin:0 0;opacity:0}
.lab{font-size:31px;font-weight:800;white-space:nowrap;padding:12px 22px;border-radius:18px;background:rgba(18,18,22,.92);border:3px solid}
.sig{width:30px;height:30px;margin:-15px 0 0 -15px;border-radius:50%;background:radial-gradient(circle,#fff 0%,#7fe9ff 40%,rgba(64,200,224,0) 72%)}
#finger{font-size:150px;line-height:1;margin:-150px 0 0 -55px}
#say{font-size:34px;font-weight:800;color:#000;background:#fff;padding:14px 22px;border-radius:24px;white-space:nowrap;box-shadow:0 8px 24px rgba(0,0,0,.4)}

#capband{position:absolute;left:0;right:0;top:1500px;height:420px;background:linear-gradient(180deg,rgba(0,0,0,0) 0%,rgba(0,0,0,.88) 32%,#000 100%)}
#cap{position:absolute;left:30px;right:30px;top:1570px;height:270px;display:flex;align-items:center;justify-content:center;text-align:center}
#capin{font-family:"Inter Display",Inter,sans-serif;font-weight:800;font-size:76px;line-height:1.08;letter-spacing:-1.5px;text-shadow:0 4px 0 rgba(0,0,0,.4)}
#capin .w{display:inline-block;margin:0 .13em}
#capin .w.on{color:#ffd60a}
#prog{position:absolute;left:140px;top:1880px;width:800px;height:6px;border-radius:3px;background:rgba(255,255,255,.12);overflow:hidden}
#prog i{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:#ffd60a}
#fadeov{position:absolute;inset:0;background:#000;opacity:0}
</style>
</head>
<body>
<div id="stage">
  <div id="spot"></div>
  <div id="view"><div id="cam"><div id="rig">
    <div class="lay" id="lBack"><div class="hw" style="left:-6px;top:150px;height:58px"></div><div class="hw" style="left:-6px;top:250px;height:96px"></div>
      <div class="hw" style="left:-6px;top:366px;height:96px"></div><div class="hw" style="right:-6px;top:290px;height:150px"></div>
      <div id="phone"><div id="bezel"></div></div></div>
    <div class="lay" id="lBoard"><div id="board"><svg viewBox="0 0 438 928" width="438" height="928" fill="none" stroke="#c9a54a" stroke-width="2.4" stroke-linecap="round" opacity=".75">

      </svg><div id="chipglow"></div><div id="chip"><div class="eye" style="left:34px"><i id="p1"></i></div><div class="eye" style="left:86px"><i id="p2"></i></div><div id="mouth"></div></div></div></div>

<script>
// ================= utilidades =================
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const lerp=(a,b,p)=>a+(b-a)*p;
const prog=(t,a,b)=>clamp((t-a)/(b-a));
const eio=p=>p<.5?4*p*p*p:1-Math.pow(-2*p+2,3)/2;
const eout=p=>1-Math.pow(1-p,3);
const eback=p=>{const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(p-1,3)+c1*Math.pow(p-1,2)};
const win=(t,a,b,f=.3)=>Math.min(prog(t,a,a+f),1-prog(t,b-f,b));
const $=id=>document.getElementById(id);
const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const vis=(el,op)=>{el.style.opacity=op; el.style.visibility=op>.001?'visible':'hidden';};
const ic=(d,sw=2)=>`<svg viewBox="0 0 24 24" width="100%" height="100%" fill="none" stroke="currentColor" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round">${d}</svg>`;
const ICON={
 mic:ic('<path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" x2="12" y1="19" y2="22"/>',1.8),
 globe:ic('<circle cx="12" cy="12" r="10"/><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"/><path d="M2 12h20"/>',1.6),
 smile:ic('<circle cx="12" cy="12" r="10"/><path d="M8 14s1.5 2 4 2 4-2 4-2"/><line x1="9" x2="9.01" y1="9" y2="9"/><line x1="15" x2="15.01" y1="9" y2="9"/>',1.7),
 del:ic('<path d="M10 5a2 2 0 0 0-1.344.519l-6.328 5.74a1 1 0 0 0 0 1.481l6.328 5.741A2 2 0 0 0 10 19h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2z"/><path d="m12 9 6 6"/><path d="m18 9-6 6"/>',1.7),
 check:ic('<path d="M20 6 9 17l-5-5"/>',3.2), x:ic('<path d="M18 6 6 18"/><path d="m6 6 12 12"/>',3.2),
};
const SHIFT={
 off:'<svg viewBox="0 0 24 26" width="100%" height="100%"><path d="M12 2.6 2.8 12.3H8.1V19.6H15.9V12.3H21.2Z" fill="none" stroke="#111" stroke-width="1.7" stroke-linejoin="round"/></svg>',
 on:'<svg viewBox="0 0 24 26" width="100%" height="100%"><path d="M12 2.6 2.8 12.3H8.1V19.6H15.9V12.3H21.2Z" fill="#111" stroke="#111" stroke-width="1.7" stroke-linejoin="round"/></svg>',
};
document.querySelectorAll('[data-icon]').forEach(el=>el.innerHTML=ICON[el.dataset.icon]);
$('vok').innerHTML=`${ICON.check}“Hola”`; $('vno').innerHTML=`${ICON.x}<s>“Hols”</s>`;
$('sbr').innerHTML=`<svg width="19" height="12" viewBox="0 0 19 12" fill="#000"><rect x="0" y="8" width="3.4" height="4" rx="1"/><rect x="5.1" y="5.5" width="3.4" height="6.5" rx="1"/><rect x="10.2" y="3" width="3.4" height="9" rx="1"/><rect x="15.3" y="0" width="3.4" height="12" rx="1"/></svg>
<svg width="27" height="13" viewBox="0 0 27 13"><rect x=".5" y=".5" width="23" height="12" rx="3.6" fill="none" stroke="#000" stroke-opacity=".45"/><rect x="2.2" y="2.2" width="17" height="8.6" rx="2" fill="#000"/></svg>`;

// ================= teclado =================
const KEYS=[];
(()=>{
  const row=(arr,y,x0)=>arr.forEach((c,i)=>KEYS.push({id:c,label:c,x:x0+i*43.2,y,w:37.6,h:50,t:'l'}));
  row('qwertyuiop'.split(''),10,5.8); row('asdfghjklñ'.split(''),72,5.8); row('zxcvbnm'.split(''),134,70.6);
  KEYS.push({id:'shift',x:5.8,y:134,w:52,h:50,t:'s',icon:'shift'},{id:'del',x:380.2,y:134,w:52,h:50,t:'s',icon:'del'},
    {id:'123',label:'123',x:5.8,y:196,w:46,h:50,t:'s'},{id:'emoji',x:57.4,y:196,w:46,h:50,t:'s',icon:'smile'},
    {id:'space',label:'espacio',x:109,y:196,w:214,h:50,t:'w'},{id:'ret',label:'intro',x:328.6,y:196,w:103.6,h:50,t:'s'});
})();
const KEYEL={}, ZONEL={};
for(const k of KEYS){
  const el=document.createElement('div'); el.className='key'+(k.t==='s'?' sp':'');
  el.style.cssText=`left:${k.x}px;top:${k.y}px;width:${k.w}px`;
  if(k.icon==='shift') el.innerHTML='<div class="ki" id="shiftic"></div>'; else if(k.icon) el.innerHTML=`<div class="ki">${ICON[k.icon]}</div>`; else el.textContent=k.label;
  if(k.t!=='l') el.style.fontSize='16px';
  $('keys').appendChild(el); KEYEL[k.id]=el;
  if(k.t==='l'){ const z=document.createElement('div'); z.className='zone'; $('zones').appendChild(z); ZONEL[k.id]=z; }
}
const LETTERS=KEYS.filter(k=>k.t==='l');
const ROWS=[10,72,134].map(y=>LETTERS.filter(k=>k.y===y).sort((a,b)=>a.x-b.x));
const keyRect=id=>KEYS.find(k=>k.id===id);
// "jardines": la zona táctil invisible de cada tecla; los bordes se corren según la probabilidad de cada letra
function zoneRects(W){
  const out={};
  for(const row of ROWS){
    const n=row.length, b=[];
    for(let i=0;i<n-1;i++){ const mid=(row[i].x+row[i].w+row[i+1].x)/2; b.push(mid+clamp(((W[row[i].id]??1)-(W[row[i+1].id]??1))*14,-26,26)); }
    row.forEach((k,i)=>{ const w=W[k.id]??1, l=i?b[i-1]:k.x-2.8, r=i<n-1?b[i]:k.x+k.w+2.8, g=w>1?(w-1)*13:-(1-w)*9;
      out[k.id]={x:l+1,y:k.y-6-g+1,w:r-l-2,h:62+2*g-2,w8:w}; });
  }
  return out;
}
function kbSim(init,taps,lt){
  const st={ch:Array.from(init.text),shift:init.shift||0,lastInput:-9};
  for(const e of taps){ const eff=e.at+.06; if(eff>lt) break; let c=e.k==='space'?' ':e.k; if(st.shift&&c!==' ') c=c.toUpperCase(); st.ch.push(c); if(st.shift===1&&c!==' ') st.shift=0; st.lastInput=eff; }
  return st;
}

V.sents.forEach(s=>{
  const W=s.words, L=W.length, P=i=>/[,…:;.!?]$/.test(W[i].w)&&W[i].w.replace(/[^\p{L}]/gu,'').length>1;
  const cost=(i,j)=>{ const txt=W.slice(i,j).map(x=>x.w).join(' '), n=j-i; let c=10+.08*(txt.length-17)**2;
    if(txt.length>26||n>4) c+=1000; if(n===1) c+=25;
    if(j<L){ if(P(j-1)) c-=12; if(!/^[A-ZÑ][^\p{L}]*$/u.test(W[j-1].w)&&WEAK.has(W[j-1].w.toLowerCase().replace(/[^\p{L}]/gu,''))) c+=22; }
    return c; };
  const best=[0], from=[0];
  for(let j=1;j<=L;j++){ best[j]=1e9; for(let i=Math.max(0,j-4);i<j;i++){ const v=best[i]+cost(i,j); if(v<best[j]){best[j]=v; from[j]=i;} } }
  const parts=[]; for(let j=L;j>0;j=from[j]) parts.unshift(W.slice(from[j],j));
  parts.forEach(p=>CHUNKS.push({words:p}));
});

    else if(w<.98){ const b=clamp((1-w)/.5); bg=`rgba(255,59,48,${.08+.06*b})`; bd=`2px dashed rgba(255,59,48,${.5+.4*b})`; }
    else { bg='rgba(52,199,89,.15)'; bd='1.6px dashed rgba(36,160,70,.7)'; if(S.zDim) op*=lerp(1,.45,S.zDim); }
    vis(z,op); z.style.cssText+=`;left:${r.x}px;top:${r.y}px;width:${r.w}px;height:${r.h}px;background:${bg};border:${bd};box-shadow:${sh};z-index:${zi}`; });
  vis($('bline'),S.bline);

  // ---- paneles ----
  vis($('pthink'),S.think?S.think.op:0);
  if(S.think){ setOnce($('btext'),'bt','textContent',S.think.txt); const p=S.think.bars; $('bars').style.display=p>0?'block':'none';
    $('barA').style.width=(200*p)+'px'; $('barG').style.width=(30*p)+'px'; $('barL').style.width=(20*p)+'px'; }
  vis($('pverd'),S.verd?S.verd.op:0);
  if(S.verd) for(const [id,v] of [['vok',S.verd.ok],['vno',S.verd.no]]){ const el=$(id); el.style.opacity=v; el.style.transform=`scale(${lerp(.6,1,eback(v))})`; }
  vis($('pmarq'),S.marq?S.marq.op:0);
  if(S.marq) [0,1,2].forEach(i=>$('mr'+i).style.transform=`translateX(${-((S.marq.x*(150+i*35))+i*90)%620}px)`);
  vis($('pchips'),S.chips>=0?S.chipsOp:0);
  if(S.chips>=0) document.querySelectorAll('.uchip').forEach((el,j)=>{const p=prog(S.chips,.15+j*.22,.35+j*.22); el.style.opacity=p; el.style.transform=`scale(${lerp(.5,1,eback(p))})`;});
  vis($('plegend'),S.legend);
  const em=$('emoji'); vis(em,S.emoji?S.emoji.op:0); if(S.emoji){ setOnce(em,'em','textContent',S.emoji.ch); em.style.transform=`scale(${S.emoji.s})`; }
  const cta=$('cta'); vis(cta,S.cta?S.cta.op:0); if(S.cta) cta.style.transform=`scale(${S.cta.s})`;

  // ---- subtítulos ----
  const ch=CHUNKS.find(c=>t>=c.a&&t<c.b), capin=$('capin');
  setOnce(capin,'cap','innerHTML',ch?ch.html:'');
  if(ch){ const p=ch.a===0?1:prog(t,ch.a,ch.a+.12); capin.style.opacity=p; capin.style.transform=`scale(${lerp(.86,1,eback(p))})`;
    capin.querySelectorAll('.w').forEach((el,j)=>{ const w=ch.words[j], nx=ch.words[j+1]; el.className='w'+(t>=w.t0-.03&&t<(nx?nx.t0:ch.b)-.03?' on':''); }); }
  $('prog').firstElementChild.style.width=(t/V.dur*100)+'%';
  $('fadeov').style.opacity=S.fade;
}
window.renderAt=renderAt; window.TOTAL=V.dur;
renderAt(0);
if(!navigator.webdriver){ const t0=performance.now(); const loop=()=>{ renderAt(((performance.now()-t0)/1000)%V.dur); requestAnimationFrame(loop); }; requestAnimationFrame(loop); }
</script>
